<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHUL.FISH — копчёная, вяленая рыба и икра в Варшаве</title>
  <meta name="description" content="SHUL.FISH — премиальная копчёная, вяленая и сушёная рыба, красная и чёрная икра с доставкой по Варшаве.">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a href="#/" class="brand" aria-label="SHUL.FISH — на главную">
      <img src="/img/logo.jpg" alt="" class="brand-logo">
      <span class="brand-name">SHUL<span class="dot">.</span>FISH</span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/catalog" data-nav="catalog">Каталог</a>
      <a href="#/catalog/smoked" data-nav="smoked">Копчёная</a>
      <a href="#/catalog/cured" data-nav="cured">Вяленая</a>
      <a href="#/catalog/dried" data-nav="dried">Сушёная</a>
      <a href="#/catalog/caviar" data-nav="caviar">Икра</a>
      <a href="#/delivery" data-nav="delivery">Доставка</a>
    </nav>
    <div class="actions">
      <a href="#/admin" class="btn-icon staff-only hidden" id="adminLink" title="Панель управления">⚙</a>
      <a href="#/account" class="btn-icon" id="accountLink" title="Личный кабинет">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </a>
      <a href="#/cart" class="btn-icon cart-btn" title="Корзина">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
      <button class="btn-icon burger" id="burger" aria-label="Меню">☰</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <div class="brand-name small">SHUL<span class="dot">.</span>FISH</div>
        <p class="muted">Копчёная, вяленая, сушёная рыба и икра. Premium quality.</p>
      </div>
      <div>
        <div class="footer-title">Доставка</div>
        <p class="muted">По Варшаве — курьером в день заказа.<br>Самовывоз — по договорённости.</p>
      </div>
      <div>
        <div class="footer-title">Контакты</div>
        <p class="muted">Warszawa, Polska<br>Пн–Вс 10:00–21:00</p>
      </div>
    </div>
    <div class="footer-bottom muted">© <span id="year"></span> SHUL.FISH · Warszawa</div>
  </footer>

  <div class="toast-wrap" id="toasts"></div>
  <div class="modal hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box">
      <button class="modal-x" data-close aria-label="Закрыть">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
